name: LightCore CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Import every loaded cog
        run: python -c "import cogs.moderation, cogs.automod, cogs.logging, cogs.leveling, cogs.tickets, cogs.roles, cogs.currency, cogs.music, cogs.embeds, cogs.panels, cogs.welcome, cogs.giveaways, cogs.custom_commands, cogs.temp_voice, cogs.fun, cogs.games, cogs.serverinfo, cogs.admin, cogs.memberstats, cogs.applications, cogs.advanced_safe, cogs.core; print('All loaded cogs imported successfully')"
      - name: Initialize database schema
        run: python -c "from database import init_db; init_db(); print('Database schema initialized successfully')"
